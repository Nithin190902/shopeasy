name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, linux, x64, azure-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
